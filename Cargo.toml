[package]
name = "serial-debugger"
version = "0.1.12"
edition = "2021"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
async-channel = "2"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
dirs = "6"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.9"
uuid = { version = "1", features = ["v4", "serde"] }
